<h1>
  ------------ Update a Product ------
</h1>
<form (ngSubmit)="updateProduct()">
  Id : <input type="number" [(ngModel)]="updatedProductId" name="id"> <br><br>
  Name : <input type="text" [(ngModel)]="updatedProduct.name" name="name"> <br><br>
  Description : <input type="text" [(ngModel)]="updatedProduct.description" name="description"> <br><br>
  Price : <input type="number" [(ngModel)]="updatedProduct.price" name="price"> <br><br>
  <button type="submit">Update Product</button>
</form>
